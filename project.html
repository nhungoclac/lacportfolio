<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lạc Ngọc Như - Chi tiết Chiến dịch</title>
    <!-- Favicon Icon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="fixed-header">
      <div class="nav-container">
        <a href="index.html" class="nav-brand">
          <div class="nav-logo-badge">
            <img src="favicon.svg" alt="Logo" class="nav-logo-img" />
          </div>
          <span class="nav-name">Lạc Ngọc Như</span>
        </a>
        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Toggle navigation"
        >
          <i class="fas fa-bars"></i>
        </button>
        <nav class="nav-bar" id="navBar">
          <a href="index.html" class="nav-link"
            ><i class="fas fa-user-circle"></i> Giới thiệu</a
          >
          <a href="campaigns.html" class="nav-link active"
            ><i class="fas fa-chart-pie"></i> Chiến dịch</a
          >
          <a href="standalone.html" class="nav-link"
            ><i class="fas fa-layer-group"></i> Sản phẩm & Kỹ năng khác</a
          >
          <a href="briefs.html" class="nav-link"
            ><i class="fas fa-file-alt"></i> Brief & Output</a
          >
        </nav>
      </div>
    </header>

    <div class="container">
      <!-- NAVIGATION BACK -->
      <div style="margin-bottom: 1.5rem">
        <a href="campaigns.html" class="cv-btn"
          ><i class="fas fa-arrow-left"></i> Quay lại Danh sách Chiến dịch</a
        >
      </div>

      <!-- DYNAMIC PROJECT DETAIL CONTAINER -->
      <div id="project-detail-container">
        <div
          class="project-detail-loading"
          style="text-align: center; padding: 3rem 1rem"
        >
          <i
            class="fas fa-circle-notch fa-spin"
            style="font-size: 2rem; color: #0284c7"
          ></i>
          <p style="margin-top: 1rem; font-weight: 600; color: #0f172a">
            Đang tải chi tiết sản phẩm của chiến dịch...
          </p>
        </div>
      </div>

      <div class="footer-note">
        <i class="fas fa-bullhorn"></i> Marketing Portfolio - Lạc Ngọc Như
      </div>
    </div>

    <!-- LIGHTBOX OVERLAY -->
    <div id="image-lightbox">
      <button class="lightbox-close" aria-label="Đóng">&times;</button>
      <button class="lightbox-nav lightbox-prev" aria-label="Ảnh trước">
        &lang;
      </button>
      <img class="lightbox-content" src="" alt="Zoom Image" />
      <button class="lightbox-nav lightbox-next" aria-label="Ảnh tiếp">
        &rang;
      </button>
      <div class="lightbox-counter">1/1</div>
    </div>

    <button
      id="back-to-top"
      class="back-to-top hidden"
      aria-label="Trở về đầu trang"
    >
      <i class="fas fa-arrow-up"></i>
    </button>
    <script src="script.js"></script>
  </body>
</html>
