<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lạc Ngọc Như</title>
    <!-- Favicon Icon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- HEADER -->
      <header class="fixed-header">
        <div class="nav-container">
          <a href="index.html" class="nav-brand" id="lacBadge" title="Lạc - Marketing Executive ✨">
            <div class="nav-mascot-wrap" id="lacPeanutGroup">
              <img src="photo/lac_mascot_modern.png" alt="Bé Lạc Mascot" class="nav-mascot-img" />
            </div>
            <div class="nav-typo-lockup">
              <div class="nav-wordmark">Lạc <span class="nav-star">✦</span></div>
              <div class="nav-sub-text">Marketing Executive</div>
            </div>
          </a>
          <!-- REALTIME CLOCK WIDGET IN HEADER -->
          <div
            class="nav-clock-pill"
            id="realtime-clock"
            title="Giờ địa phương real-time (GMT+7)"
          >
            <span class="clock-live-dot"></span>
            <span class="clock-city">HCM</span>
            <span id="clock-time">--:--:--</span>
            <span class="clock-tz">GMT+7</span>
          </div>
          <button
            class="nav-toggle"
            id="navToggle"
            aria-label="Toggle navigation"
          >
            <i class="fas fa-bars"></i>
          </button>
          <nav class="nav-bar" id="navBar">
            <a href="index.html" class="nav-link"
              >Giới thiệu</a
            >
            <a href="campaigns.html" class="nav-link active"
              >Chiến dịch</a
            >
            <a href="design.html" class="nav-link"
              >Thiết kế</a
            >
            <a href="ai.html" class="nav-link"
              >AI Automation</a
            >
            <a href="standalone.html" class="nav-link"
              >Khác</a
            >
          </nav>
        </div>
      </header>
      <!-- NAVIGATION BACK -->
      <div style="margin-bottom: 1.5rem">
        <a href="campaigns.html" class="cv-btn btn-outline-blue"
          ><i class="fas fa-arrow-left"></i> Quay lại Danh sách Chiến dịch</a
        >
      </div>

      <!-- DYNAMIC PROJECT DETAIL CONTAINER -->
      <div id="project-detail-container">
        <div
          class="project-detail-loading"
          style="text-align: center; padding: 3rem 1rem"
        >
          <i
            class="fas fa-circle-notch fa-spin"
            style="font-size: 2rem; color: #0284c7"
          ></i>
          <p style="margin-top: 1rem; font-weight: 600; color: #0f172a">
            Đang tải chi tiết sản phẩm của chiến dịch...
          </p>
        </div>
      </div>

      <!-- LIÊN HỆ -->
      <section class="section" id="contact">
        <h2 class="section-title">Liên hệ</h2>
        <div class="contact-links">
          <a
            href="https://zalo.me/0708478108"
            class="contact-btn"
            target="_blank"
            rel="noopener noreferrer"
            ><i class="zalo-icon">Z</i> Zalo</a
          >
          <a
            href="https://www.facebook.com/lacnhu04"
            class="contact-btn"
            target="_blank"
            rel="noopener noreferrer"
            ><i class="fab fa-facebook"></i> Facebook</a
          >
          <a
            href="https://www.linkedin.com/in/nh%C6%B0-l%E1%BA%A1c-ng%E1%BB%8Dc-947009350/"
            class="contact-btn"
            target="_blank"
            rel="noopener noreferrer"
            ><i class="fab fa-linkedin"></i> LinkedIn</a
          >
        </div>
      </section>

      <div class="footer-note">
        <i class="fas fa-bullhorn"></i> Marketing Portfolio - Lạc Ngọc Như
      </div>
    </div>

    <!-- LIGHTBOX OVERLAY -->
    <div id="image-lightbox">
      <button class="lightbox-close" aria-label="Đóng">&times;</button>
      <button class="lightbox-nav lightbox-prev" aria-label="Ảnh trước">
        &lang;
      </button>
      <img class="lightbox-content" src="" alt="Zoom Image" />
      <button class="lightbox-nav lightbox-next" aria-label="Ảnh tiếp">
        &rang;
      </button>
      <div class="lightbox-counter">1/1</div>
    </div>

    <button
      id="back-to-top"
      class="back-to-top hidden"
      aria-label="Trở về đầu trang"
    >
      <i class="fas fa-arrow-up"></i>
    </button>
    <script src="script.js"></script>
  </body>
</html>
